<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h3>Iniciar sesión</h3>

    <p>Esta pantalla es solo una maqueta. El proyecto no incluye un servidor para autenticar usuarios.</p>
    <form id="form-login">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Iniciar sesión</button>
        <p id="estado-login" role="status" aria-live="polite"></p>

    </form>

    <script>
    document.getElementById("form-login").addEventListener("submit", evento => {
        evento.preventDefault();
        document.getElementById("estado-login").textContent = "El inicio de sesión requiere un servidor y aún no está habilitado.";
    });
    </script>
</body>
</html>
