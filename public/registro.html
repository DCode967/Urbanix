<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Urbanix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>

        <h1>Crear Cuenta</h1>

        <form id="form-register" action="">
            <label for="nombre">Nombre: </label>

            <input 
            type="text"
            id="nombre"
            name="nombre"
            maxlength="60"
            autocomplete="name"
            required
            >

            <label for="correo">Correo: </label>

            <input 
            type="email"
            id="correo"
            name="correo"
            maxlength="254"
            autocomplete="email"
            required
            >

            <label for="password">Contraseña: </label>

            <input 
            type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
            >


            <button type="submit">  Crear Cuenta  </button>

            <p id="estado-registro" role="status" aria-live="polite"></p>
            </form>

            <p>¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></p>

    </main>

    <script src="js/registro.js"></script>
</body>
</html>
